name: CI

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-only-secret-not-for-production"
      GOOGLE_CLIENT_ID: "ci-client-id"
      GOOGLE_CLIENT_SECRET: "ci-client-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Refresh lockfile on hardening branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm lockfile [skip ci]"
            git push origin HEAD:fix/senior-hardening
          fi

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Create test database
        run: pnpm exec prisma db push --force-reset

      - name: Unit tests
        run: pnpm test

      - name: Database invariant tests
        run: pnpm test:db

      - name: Booking integration tests
        run: pnpm test:integration

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Seed browser test database
        run: node tests/e2e-seed.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Mobile browser E2E
        run: pnpm test:e2e
