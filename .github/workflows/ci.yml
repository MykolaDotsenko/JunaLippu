name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-only-secret-not-for-production"
      GOOGLE_CLIENT_ID: "ci-client-id"
      GOOGLE_CLIENT_SECRET: "ci-client-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Check migrations match the schema
        run: |
          pnpm exec prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code && echo "Schema and migrations are in sync."

      - name: Typecheck
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Database invariant tests
        run: pnpm test:db

      - name: Booking and search integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Seed browser test database
        run: node tests/e2e-seed.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Mobile browser E2E
        run: pnpm test:e2e
