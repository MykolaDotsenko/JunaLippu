name: CI

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/final-polish-2026]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-only-secret-not-for-production"
      GOOGLE_CLIENT_ID: "ci-client-id"
      GOOGLE_CLIENT_SECRET: "ci-client-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/final-polish-2026

      - name: Enable pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Refresh lockfile on platform-upgrade branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            cp pnpm-lock.yaml /tmp/pnpm-lock.yaml
            git fetch origin feat/final-polish-2026
            git reset --hard origin/feat/final-polish-2026
            cp /tmp/pnpm-lock.yaml pnpm-lock.yaml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm lockfile [skip ci]"
            git push origin HEAD:feat/final-polish-2026
          fi

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Create test database
        run: pnpm exec prisma db push --force-reset

      - name: Unit tests
        run: pnpm test

      - name: Database invariant tests
        run: pnpm test:db

      - name: Booking integration tests
        run: pnpm test:integration

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Seed browser test database
        run: node tests/e2e-seed.mjs

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Browser and accessibility E2E
        run: pnpm test:e2e
